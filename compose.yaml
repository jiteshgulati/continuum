services:
  continuum:
    build: .
    ports:
      - "127.0.0.1:3001:3001"
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/continuum.sqlite
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - continuum-data:/app/data
    restart: unless-stopped
volumes:
  continuum-data:
